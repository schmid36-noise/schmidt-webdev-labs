<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap Exercise 02 - Form</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="styles.css" />
    <!--  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script> -->
  </head>
  <body class="bg-light">
    <main class="d-flex align-items-center">
      <form
        method="post"
        action="/calculator"
        class="ira-form container mt-5 border border-2 bg-white rounded"
      >
        <div class="row col-12 my-4">
          <h1 class="text-center m-4 fs-2">Roth IRA Calculator</h1>
        </div>
        <div class="row mb-3">
          <label class="col-form-label col-sm-4" for="balance"
            >Balance ($)</label
          >
          <div class="col-sm-8">
            <input
              class="form-control"
              type="text"
              id="balance"
              name="balance"
            />
          </div>
        </div>

        <div class="row mb-3">
          <label class="col-form-label col-sm-4" for="contribution"
            >Annual contribution ($)</label
          >
          <div class="col-sm-8">
            <input
              class="form-control"
              type="text"
              id="contribution"
              name="contribution"
            />
          </div>
        </div>

        <fieldset class="row mb-3">
          <legend class="col-sm-6 col-form-label">
            Maximize contributions?
          </legend>
          <div class="col-sm-6">
            <div class="form-check">
              <input
                class="form-check-input"
                type="radio"
                id="yes"
                name="contribution_select"
                value="Yes"
              />
              <label class="form-check-label" for="yes">Yes</label>
            </div>
            <div class="form-check">
              <input
                class="form-check-input"
                type="radio"
                id="no"
                name="contribution_select"
                value="No"
              />
              <label class="form-check-label" for="no">No</label>
            </div>
          </div>
        </fieldset>

        <div class="row mb-3">
          <label class="col-form-label col-sm-4" for="return"
            >Expected rate of return (%)</label
          >
          <div class="col-sm-8">
            <input
              class="form-control"
              type="number"
              id="return"
              name="return"
            />
          </div>
        </div>

        <div class="row mb-3">
          <label class="col-form-label col-sm-4" for="current_age"
            >Current age</label
          >
          <div class="col-sm-8">
            <input
              class="form-control"
              type="number"
              id="current_age"
              name="current_age"
            />
          </div>
        </div>

        <div class="row mb-3">
          <label class="col-form-label col-sm-4" for="retirement_age"
            >Retirement age</label
          >
          <div class="col-sm-8">
            <input
              class="form-control"
              type="number"
              id="retirement_age"
              name="retirement_age"
            />
          </div>
        </div>

        <div class="row mb-3">
          <label class="col-form-label col-sm-4" for="tax_rate"
            >Marginal tax rate (%)</label
          >
          <div class="col-sm-8">
            <input
              class="form-control"
              type="number"
              id="tax_rate"
              name="tax_rate"
            />
          </div>
        </div>

        <div class="row my-4">
          <div class="d-flex gap-2">
            <input
              class="btn btn-primary w-100"
              type="submit"
              value="Calculate"
            />
            <input
              class="btn btn-outline-dark w-100"
              type="reset"
              value="Reset"
            />
          </div>
        </div>

        <p>
          This exercise is a simplified version of the Roth IRA Calculator at
          <a
            class="text-primary"
            href="https://www.calculator.net/roth-ira-calculator.html"
            >Calculator.net</a
          >
        </p>
      </form>
    </main>
  </body>
</html>
